<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a New Sighting – Nature Soham</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Header -->
<header class="site-header">
    <a href="index.html" class="logo-link">
        <img src="assets/images/nature-soham-logo-white-bg.png"
             alt="Nature Soham Wildlife Logo"
             class="site-logo">
    </a>
</header>

<!-- Navigation -->
<nav class="main-nav">
    <ul>
        <li><a href="new-sighting.html">Submit a New Sighting</a></li>
        <li><a href="sightings.html">Query the Sightings Database</a></li>
    </ul>
</nav>

<main>
    <h1>Submit a New Wildlife Sighting</h1>
    <p>Please complete the form below to add a new sighting to the Nature Soham database.</p>

    <form id="sighting-form">

        <label for="species">Species</label><br>
        <input type="text" id="species" name="species" required><br><br>

        <label for="location">Location</label><br>
        <input type="text" id="location" name="location" required><br><br>

        <label for="date">Date</label><br>
        <input type="date" id="date" name="date" required><br><br>

        <label for="observer">Observer Name</label><br>
        <input type="text" id="observer" name="observer" required><br><br>

        <label for="notes">Additional Notes</label><br>
        <textarea id="notes" name="notes" rows="5"></textarea><br><br>

        <button type="submit">Submit Sighting</button>
    </form>

</main>

<!-- Footer -->
<footer class="site-footer">
    <p>© 2026 Nature Soham · Community Wildlife Project</p>
    <p>
        <a href="contact.html">Contact the Website Owner</a> |
        <a href="report.html">Report a Problem</a>
    </p>
</footer>

<script>
    // Your existing JavaScript stays untouched
    document.getElementById('sighting-form').addEventListener('submit', function(event) {
        event.preventDefault();
        alert('Sighting submitted! (Form handling to be implemented)');
    });
</script>

</body>
</html>

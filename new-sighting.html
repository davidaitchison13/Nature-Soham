<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log a New Sighting – Nature-Soham</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #222;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #2e7d32;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      margin-bottom: 30px;
      color: #555;
    }

    form {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 14px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #256628;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2e7d32;
      text-decoration: none;
      font-weight: bold;
    }

    .note {
      font-size: 0.9rem;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>Log a New Sighting</h1>
  <p>Help us document wildlife in and around Soham.</p>

  <form id="sightingForm">

    <!-- 1. What type of specimen did you see? -->
    <label for="specimen">What type of specimen did you see?</label>
    <select id="specimen" required>
      <option value="">Select type...</option>
      <option>Bird</option>
      <option>Mammal</option>
      <option>Insect</option>
      <option>Amphibian</option>
      <option>Reptile</option>
      <option>Plant</option>
      <option>Arachnid</option>
      <option>Fungi</option>
      <option>Fish</option>
      <option>Other</option>
    </select>

    <!-- 2. What species or animal name do you believe it was? -->
    <label for="species">What species or animal name do you believe it was?</label>
    <input id="species" type="text" required>

    <!-- 3. Please describe the sighting -->
    <label for="description">Please describe the sighting</label>
    <textarea id="description" required></textarea>

    <!-- 4. Where did you see the animal? -->
    <label for="location">Where did you see the animal?</label>
    <input id="location" type="text" required>

    <!-- 5. What was the date of the sighting? -->
    <label for="date">What was the date of the sighting?</label>
    <input id="date" type="date" required>

    <!-- 6. What time of day was the animal seen? -->
    <label for="time">What time of day was the animal seen?</label>
    <select id="time" required>
      <option value="">Select time...</option>
      <option>Dawn</option>
      <option>Morning</option>
      <option>Afternoon</option>
      <option>Dusk</option>
      <option>Night</option>
    </select>

    <!-- 7. How many animals did you see? -->
    <label for="count">How many animals did you see?</label>
    <input id="count" type="number" min="1" required>

    <!-- 8. Your name -->
    <label for="observer">Your name</label>
    <input id="observer" type="text" required>

    <p class="note">
      When you submit, your sighting will be converted into a new row for the
      <code>Database.csv</code> file, matching the existing columns.
    </p>

    <button type="submit">Submit Sighting</button>
  </form>

  <a class="back-link" href="index.html">← Back to Home</a>

  <script>
    document.getElementById("sightingForm").addEventListener("submit", function(event) {
      event.preventDefault();

      // Build a CSV row that matches the Database.csv header order exactly:
      // What type of specimen did you see?,
      // What species or animal name do you believe it was?,
      // Please describe the sighting,
      // Where did you see the animal?,
      // What was the date of the sighting?,
      // What time of day was the animal seen?,
      // How many animals did you see?,
      // Your name

      const row = [
        document.getElementById("specimen").value,
        document.getElementById("species").value,
        document.getElementById("description").value.replace(/,/g, ";"),
        document.getElementById("location").value.replace(/,/g, ";"),
        document.getElementById("date").value,
        document.getElementById("time").value,
        document.getElementById("count").value,
        document.getElementById("observer").value.replace(/,/g, ";")
      ];

      const csvLine = row.join(",") + "\n";

      // For now, just show the CSV line so you can verify it matches Database.csv
      alert(
        "New sighting prepared as CSV:\n\n" +
        csvLine +
        "\n\nThis line is ready to be appended to Database.csv."
      );

      // Later, this is where the GitHub Action trigger will go.
    });
  </script>

</body>
</html>

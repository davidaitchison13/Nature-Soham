name: Append new sighting to CSV

on:
  repository_dispatch:
    types: [new_sighting]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Validate and append sighting row
        env:
          CSV_LINE: ${{ github.event.client_payload.csv_line }}
        run: |
          python3 - <<'PY'
          import csv
          import io
          import os
          from pathlib import Path

          line = os.environ.get("CSV_LINE", "")
          if not line or len(line) > 12000 or "\n" in line or "\r" in line:
              raise SystemExit("Missing or invalid sighting row")

          try:
              row = next(csv.reader(io.StringIO(line, newline=""), strict=True))
          except (csv.Error, StopIteration) as exc:
              raise SystemExit("Malformed CSV sighting row") from exc

          if len(row) != 14 or any(len(value) > 2000 for value in row):
              raise SystemExit("Sighting row has an invalid number of fields or field length")

          database = Path("Database.csv")
          with database.open("a", encoding="utf-8", newline="") as output:
              csv.writer(output, lineterminator="\n").writerow(row)
          PY
      - name: Commit changes
        run: |
          git config user.name "Nature-Soham Bot"
          git config user.email "actions@github.com"
          git add Database.csv
          git diff --cached --quiet || git commit -m "Add new sighting"
          git push

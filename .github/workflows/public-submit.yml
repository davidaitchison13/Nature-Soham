name: Public submission endpoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receive:
    runs-on: ubuntu-latest

    steps:
      - name: Forward payload to append workflow
        env:
          TOKEN: ${{ secrets.SUBMISSION_TOKEN }}
          PAYLOAD: ${{ github.event.inputs.csv_line }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches \
            -d "{\"event_type\":\"new_sighting\",\"client_payload\":{\"csv_line\":\"${PAYLOAD}\"}}"
